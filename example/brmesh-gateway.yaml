# ESPHome BRMesh gateway - example configuration
#
# Controls BRMesh / Fastcon BLE lights (e.g. lights paired with the "BRMesh"
# app) from Home Assistant, including the lamps' native color effects.
# See README.md for setup, the mesh key and light IDs.
#
# Adjust the substitutions below, copy secrets.example.yaml to secrets.yaml and
# fill in your values.

substitutions:
  name: brmesh-gateway
  friendly_name: BRMesh Gateway
  # Board tested: ESP32-S3 mini development board (ESP32-S3FH4R2).
  board: esp32-s3-devkitm-1

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # The effect re-send in the fastcon component relies on light API changes
  # in ESPHome 2026.10.0 (esphome/esphome#19916).
  min_version: 2026.10.0

esp32:
  board: ${board}
  framework:
    type: esp-idf
    # Optional: if the boot log says "Set flash_chip: generic under esp32 >
    # framework > advanced to save IRAM", uncomment the two lines below. Only
    # do this when your board prints that hint - it depends on the flash chip.
    # advanced:
    #   flash_chip: generic

logger:
  level: DEBUG
  logs:
    # Set to DEBUG to see the plaintext payload of every command.
    fastcon.controller: INFO
    fastcon.light: INFO
    esp32_ble: INFO

api:
  encryption:
    key: !secret api_encryption_key

# Encrypted OTA updates; a bare "encryption:" reuses the API encryption key.
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback hotspot with captive portal, used when the Wi-Fi connection fails.
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

# BLE stack for the fastcon component. The lamps are controlled through BLE
# advertisements; the scan parameters keep the radio mostly free for sending.
esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 30ms
    active: false
    continuous: true

esp32_ble_server:

external_components:
  - source: github://Gehenna12/esphome-brmesh-gateway@v1.0.0
    components: [fastcon]

fastcon:
  id: fastcon_controller
  # 4-byte mesh key of your BRMesh network, 8 hex characters (see README.md).
  mesh_key: !secret brmesh_mesh_key
  # Advertising timing that works reliably with the tested lights.
  adv_interval_min: 0x20
  adv_interval_max: 0x20
  adv_duration: 150
  adv_gap: 10
  max_queue_size: 100

# Effect speed (1 = slowest, 100 = fastest), shared by all lights. Changing
# the value sends nothing by itself; it applies to the next effect call.
# set_action (not on_value) on purpose: it only runs on a real change, never
# when the value is restored at boot, so each light keeps its
# default_effect_speed until this number is used for the first time.
number:
  - platform: template
    id: effect_speed
    name: "Effect Speed"
    icon: mdi:speedometer
    entity_category: config
    min_value: 1
    max_value: 100
    step: 1
    optimistic: true
    initial_value: 1
    restore_value: true
    set_action:
      then:
        - lambda: |-
            id(fastcon_controller).set_effect_speed((uint8_t) x);

light:
  - platform: fastcon
    id: living_room_spot_1
    name: "Living Room Spot 1"
    # Light ID assigned by the BRMesh app (1-255), see README.md.
    light_id: 1
    # RGB + white lights without a cold/warm white channel.
    supports_cwww: false
    # Never drive the RGB and white LEDs at the same time.
    color_interlock: true
    # The lamps fade on their own; ESPHome transitions would send a burst of
    # BLE commands.
    default_transition_length: 0s
    # Native effects, executed by the lamp itself. Each effect is a type
    # (fade or flash) plus a list of color codes (1-15, see docs/PROTOCOL.md):
    #   1 dark blue, 2 red, 3 pink/purple, 4 green, 5 light blue, 6 yellow,
    #   7 white (RGB white)
    # The first 21 entries reproduce the built-in effects of the BRMesh app.
    # The block is defined once (YAML anchor &brmesh_effects) and reused below.
    effects: &brmesh_effects
      - color_list:
          name: "Full Color Fade"
          type: fade
          colors: [2, 3, 1, 5, 4, 6]
      - color_list:
          name: "Fresh"
          type: fade
          colors: [5, 1, 4]
      - color_list:
          name: "Christmas"
          type: fade
          colors: [2, 4]
      - color_list:
          name: "Winter"
          type: fade
          colors: [1, 7]
      - color_list:
          name: "Halloween"
          type: fade
          colors: [4, 7]
      - color_list:
          name: "Valentines Day"
          type: fade
          colors: [2, 7]
      - color_list:
          name: "Romantic"
          type: fade
          colors: [3, 2]
      - color_list:
          name: "Cozy"
          type: fade
          colors: [6, 2]
      - color_list:
          name: "Full Color Flash"
          type: flash
          colors: [2, 3, 1, 5, 4, 6]
      - color_list:
          name: "Three Color Flash"
          type: flash
          colors: [2, 4, 1]
      - color_list:
          name: "Yellow and Green Flash"
          type: flash
          colors: [6, 4]
      - color_list:
          name: "Purple and Green Flash"
          type: flash
          colors: [3, 4]
      - color_list:
          name: "Purple and Blue Flash"
          type: flash
          colors: [3, 1]
      - color_list:
          name: "Yellow and Purple Flash"
          type: flash
          colors: [6, 3]
      - color_list:
          name: "Red and Green Flash"
          type: flash
          colors: [2, 4]
      - color_list:
          name: "Red and Blue Flash"
          type: flash
          colors: [2, 1]
      - color_list:
          name: "Green and Blue Flash"
          type: flash
          colors: [4, 1]
      - color_list:
          name: "Red Flash"
          type: flash
          colors: [2]
      - color_list:
          name: "Green Flash"
          type: flash
          colors: [4]
      - color_list:
          name: "Blue Flash"
          type: flash
          colors: [1]
      - color_list:
          name: "White Flash"
          type: flash
          colors: [7]
      # Your own effects: any type plus 1-9 color codes. Example:
      - color_list:
          name: "St Patricks Day"
          type: fade
          colors: [4]

  - platform: fastcon
    id: living_room_spot_2
    name: "Living Room Spot 2"
    light_id: 2
    supports_cwww: false
    color_interlock: true
    default_transition_length: 0s
    effects: *brmesh_effects

  - platform: fastcon
    id: living_room_spot_3
    name: "Living Room Spot 3"
    light_id: 3
    supports_cwww: false
    color_interlock: true
    default_transition_length: 0s
    effects: *brmesh_effects

# Optional diagnostics. Uncomment "debug:" plus the debug sensors to watch
# heap usage and the last reset reason.
# debug:
#   update_interval: 60s

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
  # - platform: debug
  #   free:
  #     name: "Free Heap"
  #   block:
  #     name: "Largest Heap Block"
  #   loop_time:
  #     name: "Loop Time"

# text_sensor:
#   - platform: debug
#     reset_reason:
#       name: "Reset Reason"

button:
  - platform: restart
    name: "Restart"
  - platform: safe_mode
    name: "Safe Mode"
