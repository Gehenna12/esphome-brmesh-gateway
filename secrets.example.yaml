# Copy this file to secrets.yaml next to your device YAML and replace every
# value. Never commit secrets.yaml.
#
# The placeholders are syntactically valid so that `esphome config` passes
# (the CI workflow uses this file as-is). They must not be used on a device.

wifi_ssid: "your-wifi-ssid"
wifi_password: "your-wifi-password"

# Password for the fallback hotspot (at least 8 characters).
fallback_ap_password: "change-me-please"

# 32-byte key, base64-encoded. Generate your own, e.g.:
#   python3 -c "import base64, os; print(base64.b64encode(os.urandom(32)).decode())"
# or let the ESPHome dashboard create one for a new device.
# The placeholder below decodes to "EXAMPLE-ONLY-REPLACE-THIS-KEY-00".
api_encryption_key: "RVhBTVBMRS1PTkxZLVJFUExBQ0UtVEhJUy1LRVktMDA="  # gitleaks:allow (placeholder)

# Mesh key of your BRMesh network: 4 bytes as 8 hex characters.
# See README.md, "Finding the mesh key".
brmesh_mesh_key: "12345678"
